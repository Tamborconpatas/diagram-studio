name: windows-smoke

# Installs the released Setup.exe on a real Windows runner, starts the app and
# exercises it. Run it by hand (Actions > windows-smoke > Run workflow) after a
# release, optionally with a tag; it also runs when this file changes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = latest)
        required: false
        default: ''
  pull_request:
    paths: ['.github/workflows/windows-smoke.yml']

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the installer
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag) { gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*Setup.exe' --dir installer }
          else { gh release download --repo $env:GITHUB_REPOSITORY --pattern '*Setup.exe' --dir installer }
          Get-ChildItem installer | Format-Table Name, Length

      - name: Install silently
        run: |
          $setup = (Get-ChildItem installer -Filter *Setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Diagram Studio.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Diagram Studio.exe not found after install' }
          "APP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Installed at $($exe.FullName)"

      - name: Shortcuts exist
        run: |
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Diagram Studio.lnk'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Diagram Studio.lnk'
          foreach ($lnk in $desktop, $menu) {
            if (-not (Test-Path $lnk)) { throw "Missing shortcut: $lnk" }
            Write-Host "OK $lnk"
          }

      - name: Start the app
        run: |
          Start-Process -FilePath $env:APP_EXE
          # The app picks a random localhost port: find the listening port of the
          # app's processes that answers with the UI.
          $page = $null
          for ($i = 0; $i -lt 30 -and -not $page; $i++) {
            Start-Sleep -Seconds 2
            $ids = @(Get-Process -Name 'Diagram Studio' -ErrorAction SilentlyContinue | ForEach-Object Id)
            $ports = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess -and $_.LocalAddress -eq '127.0.0.1' } | ForEach-Object LocalPort | Sort-Object -Unique)
            foreach ($port in $ports) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:$port/"
                if ($r.StatusCode -eq 200 -and $r.Content -match '<div id="root"') { $page = "http://127.0.0.1:$port/"; break }
              } catch {}
            }
          }
          if (-not $page) {
            Get-Process -Name 'Diagram Studio' -ErrorAction SilentlyContinue | Format-Table Id, ProcessName
            Get-NetTCPConnection -State Listen | Format-Table LocalAddress, LocalPort, OwningProcess
            throw 'The app never served its UI'
          }
          "APP_URL=$page" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Serving at $page"

      - name: Exercise the app
        run: |
          $base = $env:APP_URL.TrimEnd('/')
          $origin = @{ Origin = $base }
          function Post($path, $body) {
            Invoke-RestMethod -Method Post -Uri "$base$path" -Headers $origin -ContentType 'application/json' -Body ($body | ConvertTo-Json)
          }

          $index = Invoke-WebRequest -UseBasicParsing $base
          if ($index.StatusCode -ne 200) { throw "index returned $($index.StatusCode)" }
          Write-Host 'OK index'

          $status = Invoke-RestMethod "$base/api/tools/status"
          $status.tools | Format-Table id, installed

          $foreign = try { Invoke-WebRequest -UseBasicParsing -Method Post -Uri "$base/api/render-dbml" -Headers @{ Origin = 'http://evil.example' } -Body '{}' -ContentType 'application/json' } catch { $_.Exception.Response }
          if ([int]$foreign.StatusCode -ne 403) { throw 'a foreign Origin was not rejected' }
          Write-Host 'OK foreign origin rejected'

          $dbml = Post '/api/render-dbml' @{ code = 'Table users { id int [pk] }' }
          if ($dbml.svg -notmatch '<svg') { throw 'dbml did not return an SVG' }
          Write-Host 'OK render dbml (bundled CLI run by Electron as Node)'

          if (($status.tools | Where-Object id -eq 'java').installed) {
            $ditaa = Post '/api/render-ditaa' @{ code = "+--+`n|hi|`n+--+" }
            if ($ditaa.svg -notmatch '<svg') { throw 'ditaa did not return an SVG' }
            Write-Host 'OK render ditaa (bundled jar through java)'
          } else { Write-Host 'SKIP ditaa: no java on this runner' }

      - name: Screenshot
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\desktop.png")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop
          path: ${{ runner.temp }}/desktop.png

      - name: Uninstall
        run: |
          Stop-Process -Name 'Diagram Studio' -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $dir = Split-Path $env:APP_EXE
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'no uninstaller found' }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $env:APP_EXE) { throw 'the app is still installed after uninstalling' }
          Write-Host 'OK uninstalled'
